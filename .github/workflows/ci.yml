name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: composer check (PHP ${{ matrix.php }})
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # The php.ini of a production host, which is also this action's default: no arguments in the traces of
          # exceptions, no bytes of a string argument in their string form, assertions off. Named here so the
          # suite is known to pass under it; phpunit.xml.dist sets what the leak tests need. To run the suite
          # the same way on your own machine, see "Development" in the README.
          ini-file: production
          coverage: none
          tools: composer:v2

      - run: composer validate --strict

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: composer check

  gitleaks:
    name: gitleaks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks binary, not gitleaks-action: the action needs a licence key for an organisation account.
      - name: Scan the history for secrets
        run: |
          docker run --rm -v "$PWD":/repo -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config .gitleaks.toml --redact --no-banner --verbose .
